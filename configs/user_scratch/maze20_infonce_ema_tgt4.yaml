# maze20 infonce_ema_tgt4
task: {kind: maze, width: 20, height: 20, min_path: 20, seed: 0}
model: {n_layer: 6, n_head: 4, d_model: 256}
losses:
  - {kind: ntp, weight: 1.0}
  - {kind: jepa_pooled, k: 8, weight: 0.5, src_layer: -1, tgt_layer: 4, target: ema, objective: infonce}
train:
  steps: 4000
  batch_size: 128
  lr: 1.0e-3
  warmup: 200
  eval_every: 200
  seed: 0
