# NTP + per-token latents M=4 (position-indexed arm).
task: {kind: lm, data_dir: data/tinystories, seq_len: 512}
model: {n_layer: 8, n_head: 8, d_model: 512}
losses:
  - {kind: ntp, weight: 1.0}
  - {kind: jepa_pertoken, m: 4, weight: 0.5, src_layer: -1, tgt_layer: 1}
train:
  steps: 20000
  batch_size: 64
  lr: 6.0e-4
  warmup: 500
  eval_every: 500
  seed: 0
