# round-15: MTP k=8 on gridembed 4x4 at the frozen schedule (round-7 anchor
# at 4k-cosine: best embed_acc .203)
task: {kind: gridembed, width: 4, height: 4, seed: 0}
model: {n_layer: 6, n_head: 4, d_model: 256}
losses:
  - {kind: ntp, weight: 1.0}
  - {kind: mtp, k: 8, weight: 0.5}
train:
  steps: 48000
  batch_size: 128
  lr: 1.0e-3
  warmup: 200
  eval_every: 400
  seed: 0
  lr_schedule: constant
