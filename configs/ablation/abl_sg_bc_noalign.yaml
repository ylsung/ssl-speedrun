# round-9 cell sg_bc_noalign: attribution control — backward-chaining
# multitask (grounding + rev-MTP bottleneck) WITHOUT the latent alignment
task: {kind: stargraph, d: 5, n: 5, num_nodes: 50, seed: 0}
model: {n_layer: 6, n_head: 4, d_model: 256}
losses:
  - {kind: ntp, weight: 1.0}
  - {kind: backchain, weight: 0.0, ground_w: 0.5, mtp_w: 0.5, k: 8,
     src_layer: -1, tgt_layer: 4, target: ema, objective: cosine}
train:
  steps: 4000
  batch_size: 128
  lr: 1.0e-3
  warmup: 200
  eval_every: 200
  seed: 0
