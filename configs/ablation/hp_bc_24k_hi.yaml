# round-11 HP sweep hp_bc_24k_hi: click-rate tuning of the round-10 solve cell
# (sg_bc InfoNCE). Axis: schedule=constant, lr=2.0e-3, wd=0.01, warmup=500
task: {kind: stargraph, d: 5, n: 5, num_nodes: 50, seed: 0}
model: {n_layer: 6, n_head: 4, d_model: 256}
losses:
  - {kind: ntp, weight: 1.0}
  - {kind: backchain, weight: 0.5, ground_w: 0.5, mtp_w: 0.5, k: 8,
     src_layer: -1, tgt_layer: 4, target: ema, objective: infonce}
train:
  steps: 24000
  batch_size: 128
  lr: 2.0e-3
  warmup: 500
  eval_every: 400
  seed: 0
  lr_schedule: constant
  weight_decay: 0.01
