# round-14 baseline: NTP + MTP k=8 on forward star graph at the frozen
# schedule (does longer training + constant LR alone crack it?)
task: {kind: stargraph, d: 5, n: 5, num_nodes: 50, seed: 0}
model: {n_layer: 6, n_head: 4, d_model: 256}
losses:
  - {kind: ntp, weight: 1.0}
  - {kind: mtp, k: 8, weight: 0.5}
train:
  steps: 48000
  batch_size: 128
  lr: 1.0e-3
  warmup: 200
  eval_every: 400
  seed: 0
  lr_schedule: constant
