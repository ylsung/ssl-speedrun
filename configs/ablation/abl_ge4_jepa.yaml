# gridembed 4x4 cell ge4_jepa (see ABLATIONS.md round 7)
task: {kind: gridembed, width: 4, height: 4, seed: 0}
model: {n_layer: 6, n_head: 4, d_model: 256}
losses:
  - {kind: ntp, weight: 1.0}
  - {kind: jepa_pooled, k: 8, weight: 0.5, src_layer: -1, tgt_layer: 4, target: ema}
train:
  steps: 4000
  batch_size: 128
  lr: 1.0e-3
  warmup: 200
  eval_every: 200
  seed: 0
