# top-3-paths cell tp3_mtp8 (see ABLATIONS.md round 6)
task: {kind: maze, width: 5, height: 5, mode: toppaths, n_paths: 3, min_path: 6, seed: 0}
model: {n_layer: 6, n_head: 4, d_model: 256}
losses:
  - {kind: ntp, weight: 1.0}
  - {kind: mtp, k: 8, weight: 0.5}
train:
  steps: 4000
  batch_size: 128
  lr: 1.0e-3
  warmup: 200
  eval_every: 200
  seed: 0
