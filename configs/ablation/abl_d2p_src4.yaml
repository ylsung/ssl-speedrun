# D2' depth-separation cell d2p_src4 (see ABLATIONS.md round 4)
task: {kind: maze, width: 6, height: 6, min_path: 6, seed: 0}
model: {n_layer: 6, n_head: 4, d_model: 256}
losses:
  - {kind: ntp, weight: 1.0}
  - {kind: mtp, k: 8, weight: 0.5}
  - {kind: jepa_pooled, k: 8, weight: 0.5, src_layer: 4, tgt_layer: 4, target: ema}
train:
  steps: 4000
  batch_size: 128
  lr: 1.0e-3
  warmup: 200
  eval_every: 200
  seed: 0
