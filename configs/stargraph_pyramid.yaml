# Resolution pyramid: per-token latents at short horizon (M=4) + pooled window
# at long horizon (k=5 = one arm length). High-res near future, low-res far.
task: {kind: stargraph, d: 5, n: 5, num_nodes: 50, seed: 0}
model: {n_layer: 6, n_head: 4, d_model: 256}
losses:
  - {kind: ntp, weight: 1.0}
  - {kind: jepa_pertoken, m: 4, weight: 0.25, src_layer: -1, tgt_layer: 1, answer_only: false}
  - {kind: jepa_pooled, k: 5, weight: 0.25, src_layer: -1, tgt_layer: 1, answer_only: false}
train:
  steps: 4000
  batch_size: 128
  lr: 1.0e-3
  warmup: 200
  eval_every: 200
  seed: 0
